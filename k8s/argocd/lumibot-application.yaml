apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lumibot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AobaIwaki123/lumibot.git'
    targetRevision: HEAD
    path: k8s/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: lumibot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
